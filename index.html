<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* light by default; dark follows the board's moon button (same localStorage key) or the button top right */
  :root{color-scheme:light;--ink:#1f1d1a;--muted:#6b665e;--rule:#e2ddd3;--paper:#faf8f4;--panel:#f1ede6;--hover:#ece7de;--danger:#b5482f;--accent:#2f8a77;--pick:#d9ece7}
  html.dark{color-scheme:dark;--ink:#ece6dc;--muted:#a39b8f;--rule:#34302a;--paper:#151311;--panel:#1c1a17;--hover:#26231f;--danger:#e0806b;--accent:#6fbfae;--pick:#1f3a34}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;cursor:pointer}
  button:hover:not(:disabled){background:var(--hover)}
  button:disabled{opacity:.4;cursor:default}
  select{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:3px 6px}
  select:disabled{opacity:.4}
  input[type=checkbox]{accent-color:var(--accent);margin:0;width:15px;height:15px;flex:none;cursor:pointer}
  ul{list-style:none;margin:0;padding:0}

  /* Gmail-style shell: folders on the left, the links as rows on the right */
  #app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  #side{padding:18px 10px 24px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
  h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:24px;margin:0 0 16px 14px}
  #addOpen{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:12px 22px;border-radius:16px;border:1px solid var(--rule);background:var(--panel);margin:0 0 14px}
  #addOpen span{font-size:20px;line-height:1;font-weight:400}
  .fold{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 14px;border-radius:0 17px 17px 0;cursor:pointer;font-size:14px;position:relative;user-select:none}
  .fold:hover{background:var(--hover)}
  .fold.on{background:var(--pick);font-weight:600}
  .fold .fi{width:18px;text-align:center;color:var(--muted);flex:none;font-size:15px}
  .fold .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fold .fc{font-size:12px;color:var(--muted);font-weight:400}
  .fold .fx{display:none;gap:2px}
  .fold:hover .fx{display:flex}
  .fold:hover .fc{display:none}
  .fx button{border:0;background:none;padding:2px 5px;font-size:13px;color:var(--muted);line-height:1}
  .fx button:hover{color:var(--ink)}
  .fx button.del:hover{color:var(--danger)}
  .fold input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--accent);border-radius:3px;padding:0 6px;width:100%}
  .sideh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px 14px;display:flex;align-items:center;justify-content:space-between}
  .sideh button{border:0;background:none;font-size:18px;line-height:1;padding:0 8px;color:var(--muted)}
  .sideh button:hover{color:var(--ink)}
  .fold.idle{display:none}
  .linkdrag .fold.idle{display:flex}
  #account{margin:22px 10px 0 14px;font-size:13px;color:var(--muted);line-height:1.45}
  #account p{margin:0 0 8px}
  #account b{color:var(--ink);font-weight:500}
  #account button{margin:0 6px 6px 0}
  #account .ok{color:var(--accent)}

  #main{padding:14px 20px 32px 8px;min-width:0}
  .add{display:flex;gap:8px;margin:0 56px 10px 0}
  .add textarea{flex:1;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid transparent;border-radius:22px;padding:10px 18px;resize:none;height:44px;line-height:22px}
  .add textarea:focus{outline:0;border-color:var(--accent);background:var(--paper)}
  .add button{border-radius:22px;padding:0 18px}
  #box{background:var(--panel);border-radius:14px;overflow:hidden}
  .bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--rule)}
  .bar label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:0 6px}
  #del{color:var(--danger)}
  #msg{margin-left:auto}
  #msg button{margin-left:6px}
  #msg.err{color:var(--danger)}
  #where{font-size:13px;color:var(--ink);font-weight:600;margin-left:auto}
  #msg:not(:empty) + #where{margin-left:12px}

  #list li{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 6px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative}
  #list li:hover{background:var(--hover);box-shadow:inset 1px 0 0 var(--rule),inset -1px 0 0 var(--rule),0 1px 3px rgba(0,0,0,.12);z-index:1}
  #list li.sel{background:var(--pick)}
  #list li a{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0;color:var(--ink);text-decoration:none;font-size:14px}
  .i{width:22px;text-align:center;flex:none;font-size:15px}
  .tt{flex:none;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  li a:hover .tt{text-decoration:underline}
  .chip{flex:none;font-size:11.5px;line-height:1;padding:3px 7px;border-radius:4px;background:var(--panel);border:1px solid var(--rule);color:var(--muted)}
  .note{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13.5px}
  .note::before{content:"– "}
  .dt{flex:none;margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .h{cursor:grab;color:var(--muted);opacity:0;padding:0 2px;user-select:none;font-size:13px;flex:none}
  #list li:hover .h{opacity:1}
  .x{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:2px 8px;opacity:0}
  #list li:hover .x,.x:focus-visible{opacity:1}
  .x:hover{color:var(--danger)}
  .x.ed{font-size:14px}
  .x.ed:hover{color:var(--ink)}
  .desc{flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--accent);border-radius:4px;padding:4px 8px}
  .empty{font-size:14px;color:var(--muted);padding:28px 20px;background:var(--paper);text-align:center}

  .dragging{opacity:.35}
  .dragtag{position:fixed;top:-100px;left:0;padding:4px 10px;font-size:13px;color:var(--paper);background:var(--accent);border-radius:12px}
  .before::before,.after::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);border-radius:1px;pointer-events:none;z-index:2}
  .before::before{top:-1px}
  .after::after{bottom:-1px}
  .into{outline:2px dashed var(--accent);outline-offset:-2px}

  #theme{position:fixed;top:16px;right:16px;width:36px;height:36px;padding:0;border-radius:50%;color:var(--muted);display:grid;place-items:center}
  #theme:hover{color:var(--ink)}
  #theme svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
  html:not(.dark) .sun,html.dark .moon{display:none}

  @media (max-width:760px){
    #app{grid-template-columns:1fr}
    #side{position:static;max-height:none;padding-bottom:0}
    #main{padding:8px 10px 24px}
    .note{display:none}
    .tt{max-width:none;flex:1}
  }
</style>
<script>const TK = 'board.v1.theme'; if (localStorage.getItem(TK) === 'dark') document.documentElement.classList.add('dark');</script>
</head>
<body>
<button id="theme" title="Switch light / dark" aria-label="Switch between light and dark theme">
  <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<div id="app">
<nav id="side" aria-label="Folders">
  <h1>My links</h1>
  <button id="addOpen"><span>+</span> Add a link</button>
  <div id="folders"></div>
  <div id="account" aria-label="Google sign-in"></div>
</nav>
<main id="main">
  <div class="add">
    <textarea id="paste" placeholder="Paste a link, press Enter (a name first is optional: Quietside quietside.co.uk)" aria-label="Paste links to add"></textarea>
    <button id="addBtn">Add</button>
  </div>
  <div id="box">
    <div class="bar">
      <label><input type="checkbox" id="all" aria-label="Select all shown">Select all</label>
      <button id="del" disabled>Delete selected</button>
      <select id="move" disabled aria-label="Move selected links to a folder"></select>
      <select id="when" aria-label="Show links added in this period">
        <option value="">Any date</option><option value="1">Added today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option>
      </select>
      <select id="sort" aria-label="Order of the links">
        <option value="new">Newest first</option><option value="old">Oldest first</option><option value="mine">My order</option>
      </select>
      <span id="msg" role="status"></span>
      <span id="where"></span>
    </div>
    <ul id="list"></ul>
  </div>
</main>
</div>
<script>
const $ = id => document.getElementById(id);

// ---- where the list lives ----
// Signed out (try-it mode): in this browser, under STORE, starting with a few sample links.
// Signed in: in ONE file, "My links.json", in the person's own Google Drive, created by this page
// and found again on later visits by its appProperties marker (never by name). The browser only
// ever holds an access token in memory; localStorage remembers "signed in before" and the file id.
// load() returns the saved groups (or null when nothing is saved yet); save(groups) writes the whole
// list and throws if it can't, with a message that completes "the file updates once ...".
const CLIENT_ID = 'PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com';
const CONNECTED = !/^PASTE-/.test(CLIENT_ID);
const SCOPE = 'https://www.googleapis.com/auth/drive.file';           // only files this page created
const MARK = {app: 'my-links'}, FILE_NAME = 'My links.json';
const API = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const STORE = 'mylinks.v1', SIGNED = 'mylinks.v1.signedin', FILE = 'mylinks.v1.file';
const SAMPLES = () => [{name: 'Examples', links: [
  {title: 'Example Domain', url: 'https://example.com', icon: '🔗', added: today(), note: 'A page that exists so that examples have somewhere to point.'},
  {title: 'Bookmark', url: 'https://en.wikipedia.org/wiki/Bookmark', icon: '🔗', added: today(), note: 'Where the word comes from.'},
  {title: 'MDN Web Docs', url: 'https://developer.mozilla.org/', icon: '🔗', added: today(), note: 'How the web works, for the people who build it.'},
]}];
const signedBefore = () => localStorage.getItem(SIGNED) === '1';
const mode = () => signedBefore() ? 'drive' : 'local';
// the list with no dates and no empty folders, so two lists can be compared
const shape = g => JSON.stringify(g.filter(x => x.links.length).map(x => ({name: x.name, links: x.links.map(({added, ...l}) => l)})));
const justSamples = g => !g || shape(g) === shape(SAMPLES());

let token = null, tokenEnds = 0, gis = null, waiting = null, gisLoad = null, loaded = false;   // loaded = the list on screen came from the file this session
// Google Identity Services: loaded only when a client ID is in; a window.google already present (the test) is used as is
function loadGis(){
  if (gisLoad) return gisLoad;
  return gisLoad = new Promise((ok, no) => {
    const ready = () => {
      gis = google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: SCOPE,
        callback: r => { const w = waiting; waiting = null; w && w(r); },
        error_callback: e => { const w = waiting; waiting = null; w && w({error: e && e.type || 'no token'}); }});
      ok();
    };
    if (window.google && google.accounts && google.accounts.oauth2) return ready();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ready;
    s.onerror = () => no(new Error("Google sign-in didn't load"));
    document.head.append(s);
  });
}
// asks Google for an access token; silent = no prompt (works only if the person signed in before and the browser lets the popup open)
function getToken(silent){
  return loadGis().then(() => new Promise((ok, no) => {
    let timer = silent ? setTimeout(() => { waiting = null; no(new Error('no silent token')); }, 8000) : null;
    waiting = r => {
      clearTimeout(timer);
      if (!r || !r.access_token) return no(new Error(r && r.error || 'no token'));
      token = r.access_token;
      tokenEnds = Date.now() + ((+r.expires_in || 3600) - 60) * 1000;
      ok(token);
    };
    gis.requestAccessToken({prompt: silent ? '' : 'select_account'});
  }));
}
function needSignIn(){ if (token) { token = null; account(); } const e = new Error('you sign in again'); e.status = 401; return e; }
// one call to Drive with the token; the error message fits after "the file updates once"
async function drive(url, init = {}){
  if (!token || Date.now() > tokenEnds) throw needSignIn();
  let r;
  try { r = await fetch(url, {...init, headers: {...(init.headers || {}), Authorization: 'Bearer ' + token}}); }
  catch { throw new Error('you are back online'); }
  if (r.status === 401) throw needSignIn();
  if (!r.ok) { const e = new Error(`Google Drive accepts it (it answered ${r.status})`); e.status = r.status; throw e; }
  return r;
}
async function findFile(){
  const q = encodeURIComponent("appProperties has { key='app' and value='my-links' } and trashed=false");
  const r = await drive(`${API}?q=${q}&spaces=drive&fields=files(id,name)&pageSize=10`);
  const d = await r.json();
  return d.files && d.files[0] ? d.files[0].id : null;
}
async function createFile(groups){
  const b = 'mylinks' + Date.now();
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name: FILE_NAME, mimeType: 'application/json', appProperties: MARK})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({groups})}\r\n--${b}--`;
  const r = await drive(`${UPLOAD}?uploadType=multipart&fields=id`, {method: 'POST', headers: {'Content-Type': `multipart/related; boundary=${b}`}, body});
  return (await r.json()).id;
}
// the file id, remembered in this browser; otherwise found by the marker, otherwise created empty
async function fileId(){
  let id = localStorage.getItem(FILE);
  if (!id) { id = (await findFile()) || (await createFile([])); localStorage.setItem(FILE, id); }
  return id;
}
// if the remembered file is gone (deleted from Drive), forget it and find or create one, once
async function withFile(fn){
  try { return await fn(await fileId()); }
  catch (e) { if (e.status !== 404) throw e; localStorage.removeItem(FILE); return fn(await fileId()); }
}
const store = {
  load: async () => {
    if (mode() === 'local') { const t = localStorage.getItem(STORE); return t ? JSON.parse(t).groups : SAMPLES(); }
    return withFile(async id => { const d = await (await drive(`${API}/${id}?alt=media`)).json(); return d && d.groups || []; });
  },
  save: async (groups) => {
    if (mode() === 'local') {
      try { localStorage.setItem(STORE, JSON.stringify({groups})); }
      catch { throw new Error('this browser has no room to store it'); }
      return true;
    }
    await withFile(id => drive(`${UPLOAD}/${id}?uploadType=media`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({groups})}));
    return true;
  },
};
// groups = [{name, links: [{title, url, icon}]}]; the unnamed group ('') holds ungrouped and newly added links
let groups = [], picked = new Set(), undo = null, drag = null, notes = {};
const key = (g, i) => g + ':' + i;
const snap = () => JSON.parse(JSON.stringify(groups));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function loose(){ let g = groups.findIndex(g => !g.name); if (g < 0) { groups.unshift({name: '', links: []}); g = 0; } return g; }
function label(g){ return g.name || 'Ungrouped'; }

// the open folder is remembered in this browser by name; null = All links
const VIEW = 'board.v1.links.view';
let view = localStorage.getItem(VIEW);
function viewIndex(){ if (view === null) return -1; const i = groups.findIndex(g => g.name === view); return i; }
function open(gi){ view = gi < 0 ? null : groups[gi].name; if (view === null) localStorage.removeItem(VIEW); else localStorage.setItem(VIEW, view); picked.clear(); render(); }
// date filter and order, remembered in this browser; links with no date sort last
const WHEN = 'board.v1.links.when', SORT = 'board.v1.links.sort';
let when = localStorage.getItem(WHEN) || '', sort = localStorage.getItem(SORT) || 'new';
const today = () => new Date().toLocaleDateString('en-CA');      // YYYY-MM-DD, local time
function since(days){ const d = new Date(); d.setDate(d.getDate() - days + 1); return d.toLocaleDateString('en-CA'); }
function visible(){
  const v = viewIndex(), from = when ? since(+when) : '';
  const out = groups.flatMap((g, gi) => v < 0 || v === gi ? g.links.map((l, i) => ({l, gi, i})) : [])
    .filter(x => !from || (x.l.added && x.l.added >= from));
  if (sort !== 'mine') out.sort((a, b) => (b.l.added ? 1 : 0) - (a.l.added ? 1 : 0)
    || (sort === 'new' ? (b.l.added || '').localeCompare(a.l.added || '') : (a.l.added || '').localeCompare(b.l.added || '')));
  return out;
}
function day(iso){ return iso ? new Date(iso + 'T12:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : ''; }
// the keys of the links on screen right now
function shownKeys(){ return visible().map(x => key(x.gi, x.i)); }

function render(){
  if (view !== null && viewIndex() < 0) { view = null; localStorage.removeItem(VIEW); }
  const v = viewIndex(), total = groups.reduce((n, g) => n + g.links.length, 0);
  const fold = (gi, icon, name, count, extra = '') => `<div class="fold${v === gi ? ' on' : ''}${extra}" data-f="${gi}"${gi >= 0 ? ` data-g="${gi}"` : ''}${gi >= 0 && groups[gi].name ? ' draggable="true"' : ''} role="button" tabindex="0">
      <span class="fi">${icon}</span><span class="fn"${gi >= 0 && groups[gi].name ? ` data-rename="${gi}"` : ''}>${esc(name)}</span><span class="fc">${count}</span>
      ${gi >= 0 && groups[gi].name ? `<span class="fx"><button data-ren="${gi}" title="Rename" aria-label="Rename ${esc(name)}">✎</button><button class="del" data-xg="${gi}" title="Delete this folder (its links move to Ungrouped)" aria-label="Delete folder ${esc(name)}">×</button></span>` : ''}
    </div>`;
  $('folders').innerHTML = fold(-1, '▤', 'All links', total)
    + `<div class="sideh">Folders <button id="newGrp" title="New folder" aria-label="New folder">+</button></div>`
    + groups.map((g, gi) => g.name ? fold(gi, '▸', g.name, g.links.length) : fold(gi, '◌', 'Ungrouped', g.links.length, g.links.length ? '' : ' idle')).join('');
  $('newGrp').onclick = () => { const gi = newGroup(); save('Folder added. Type its name.'); rename(gi); };

  const rows = visible().map(x => row(x.l, x.gi, x.i, v < 0));
  $('when').value = when; $('sort').value = sort;
  $('list').innerHTML = rows.length ? rows.join('') : `<li class="empty" data-g="${v}">${when ? 'No links added in this period. Pick “Any date” to see them all.' : v < 0 ? 'No links yet. Paste one above.' : 'This folder is empty. Drag links onto it in the list on the left.'}</li>`;
  $('where').textContent = v < 0 ? `All links · ${total}` : `${label(groups[v])} · ${groups[v].links.length}`;

  const shown = shownKeys();
  $('del').disabled = $('move').disabled = !picked.size;
  $('del').textContent = picked.size ? `Delete selected (${picked.size})` : 'Delete selected';
  $('move').innerHTML = `<option value="">Move ${picked.size ? '(' + picked.size + ') ' : ''}to folder…</option>`
    + groups.map((g, gi) => `<option value="${gi}">${esc(label(g))}</option>`).join('')
    + '<option value="new">New folder…</option>';
  $('all').checked = shown.length > 0 && shown.every(k => picked.has(k));
  $('all').indeterminate = picked.size > 0 && !$('all').checked;
}

function row(l, gi, i, showChip){
  const k = key(gi, i), note = noteOf(l);
  return `<li class="${picked.has(k) ? 'sel' : ''}" draggable="true" data-g="${gi}" data-i="${i}">
      <span class="h" title="Drag to move">⠿</span>
      <input type="checkbox" data-k="${k}" ${picked.has(k) ? 'checked' : ''} aria-label="Select ${esc(l.title)}">
      <a href="${esc(l.url)}" target="_blank" rel="noopener" draggable="false" title="${esc(l.title + (note ? ' – ' + note : ''))}"><span class="i">${esc(l.icon || '🔗')}</span><span class="tt">${esc(l.title)}</span>${showChip ? `<span class="chip">${esc(label(groups[gi]))}</span>` : ''}${note ? `<span class="note">${esc(note)}</span>` : ''}<span class="dt">${day(l.added)}</span></a>
      <button class="x ed" data-ed="${k}" title="${note ? 'Edit the description' : 'Add a description'}" aria-label="Describe ${esc(l.title)}">✎</button>
      <button class="x" data-x="${k}" title="Delete this link" aria-label="Delete ${esc(l.title)}">×</button>
    </li>`;
}

// a link's own description wins; older ones come from notes, keyed by URL
function noteOf(l){ return 'note' in l ? l.note : notes[l.url] || ''; }

function describe(k){
  const [gi, i] = k.split(':').map(Number), l = groups[gi].links[i];
  const li = $('list').querySelector(`li[data-g="${gi}"][data-i="${i}"]`);
  if (!li) return;
  const box = document.createElement('input');
  box.className = 'desc';
  box.value = noteOf(l);
  box.maxLength = 300;
  box.placeholder = 'What is this? Enter to save, Esc to cancel';
  box.setAttribute('aria-label', 'Description of ' + l.title);
  li.draggable = false;
  const a = li.querySelector('a');
  a.querySelectorAll('.note, .dt, .chip').forEach(n => n.remove());
  a.removeAttribute('href');
  a.append(box);
  box.focus();
  box.onclick = e => { e.preventDefault(); e.stopPropagation(); };
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const text = box.value.trim();
    if (ok && text !== noteOf(l)) { l.note = text; save(text ? 'Description saved.' : 'Description removed.'); }
    else render();
  };
  box.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  box.onblur = () => finish(true);
}

function say(text, isErr, withUndo){
  $('msg').className = isErr ? 'err' : '';
  $('msg').innerHTML = esc(text) + (withUndo ? '<button id="undo">Undo</button>' : '');
  if (withUndo) $('undo').onclick = () => { groups = undo; undo = null; picked.clear(); save('Put back.'); };
}

// every change is kept in this browser at once, then written through store.save; if that
// fails, the browser copy is retried every 15 s and wins on the next page load
const PENDING = 'board.v1.links.pending';
let retry = null;
async function push(){
  const body = localStorage.getItem(PENDING);
  if (!body) return true;
  await store.save(JSON.parse(body).groups);
  if (localStorage.getItem(PENDING) === body) localStorage.removeItem(PENDING);
  return true;
}
async function save(okText, withUndo){
  render();
  // in Drive mode before the file was read, the list on screen is not the file's, so what is kept here is only an addition
  localStorage.setItem(PENDING, JSON.stringify(mode() === 'drive' && !loaded ? {groups, partial: true} : {groups}));
  clearTimeout(retry);
  try { await push(); say(okText, false, withUndo); }
  catch (e) {
    say(okText + ' Kept in this browser; the file updates once ' + e.message + '.', true, withUndo);
    retry = setTimeout(sync, 15000);
  }
}
async function sync(){
  try { await push(); say(mode() === 'drive' ? 'Saved to your Drive file.' : 'Saved.'); }
  catch { retry = setTimeout(sync, 15000); }
}

// "Name https://x" -> {title: Name, url}; bare "site.co.uk" gets https://, "localhost:4180" gets http://
function parse(line){
  line = line.trim();
  if (!line) return null;
  if (/^file:|(^|\s)[a-z]:[\\/]/i.test(line)) return null;     // a file on this PC: a web page can't open it
  const m = line.match(/(https?:\/\/\S+|\/\S*|(?:localhost|127\.0\.0\.1)(?::\d+)?\S*|[\w-]+(?:\.[\w-]+)+(?:[/?#]\S*)?)\s*$/i);
  if (!m) return null;
  let url = m[1];
  if (!/^https?:\/\//i.test(url) && !url.startsWith('/')) url = (/^(localhost|127\.)/i.test(url) ? 'http://' : 'https://') + url;
  const title = line.slice(0, m.index).replace(/[\s\-–—:|·]+$/, '').trim();
  return {title: title || url.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''), url, icon: '🔗'};
}

// new links go into the open folder, or Ungrouped when All links is open
function add(){
  const lines = $('paste').value.split(/\r?\n/);
  const fresh = lines.map(parse).filter(Boolean).map(l => ({...l, added: today()}));
  const bad = lines.filter(l => l.trim() && !parse(l)).length;
  if (!fresh.length) return say(bad ? "That doesn't look like a link." : 'Paste a link first.', true);
  const v = viewIndex(), gi = v < 0 ? loose() : v;
  groups[gi].links.push(...fresh);
  picked.clear();
  $('paste').value = '';
  save(`Added ${plural(fresh.length, 'link')} to ${label(groups[gi])}.` + (bad ? ` Skipped ${plural(bad, 'line')} with no link.` : ''));
}

// pull the chosen links out, keeping their order, and return them
function take(keys){
  const gone = new Set(keys), out = [];
  groups.forEach((g, gi) => { g.links = g.links.filter((l, i) => gone.has(key(gi, i)) ? (out.push(l), false) : true); });
  return out;
}

function remove(keys){
  undo = snap();
  const n = take(keys).length;
  picked.clear();
  save(`Deleted ${plural(n, 'link')}.`, true);
}

function newGroup(){ groups.push({name: 'New folder', links: []}); return groups.length - 1; }

function rename(gi){
  const span = document.querySelector(`[data-rename="${gi}"]`);
  if (!span) return;
  const box = document.createElement('input');
  box.value = groups[gi].name;
  box.setAttribute('aria-label', 'Folder name');
  span.replaceWith(box);
  box.focus(); box.select();
  box.onclick = e => e.stopPropagation();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const name = box.value.trim(), was = groups[gi].name;
    if (ok && name && name !== was) { groups[gi].name = name; if (view === was) { view = name; localStorage.setItem(VIEW, name); } save('Renamed.'); }
    else render();
  };
  box.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  box.onblur = () => finish(true);
}

$('addOpen').onclick = () => $('paste').focus();
$('addBtn').onclick = add;
$('paste').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(); } });
// a pasted block of several lines is added straight away
$('paste').addEventListener('paste', () => setTimeout(() => { if ($('paste').value.includes('\n')) add(); }));

$('folders').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.ren) return rename(+t.dataset.ren);
  if (t.dataset.xg) {
    undo = snap();
    const gi = +t.dataset.xg, {name, links: moved} = groups[gi];
    groups.splice(gi, 1);
    groups[loose()].links.push(...moved);
    picked.clear();
    return save(`Deleted folder "${name}"` + (moved.length ? `; its ${plural(moved.length, 'link')} moved to Ungrouped.` : '.'), true);
  }
  const f = t.closest('.fold');
  if (f && !t.closest('input')) open(+f.dataset.f);
});
$('folders').addEventListener('dblclick', e => { const r = e.target.closest('[data-rename]'); if (r) rename(+r.dataset.rename); });
$('folders').addEventListener('keydown', e => { const f = e.target.closest('.fold'); if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(+f.dataset.f); } });

$('list').addEventListener('change', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  if (e.target.checked) picked.add(k); else picked.delete(k);
  render();
});
$('list').addEventListener('click', e => {
  if (e.target.dataset.x) remove([e.target.dataset.x]);
  if (e.target.dataset.ed) describe(e.target.dataset.ed);
});
$('all').onchange = e => { picked = new Set(e.target.checked ? shownKeys() : []); render(); };
$('del').onclick = () => remove([...picked]);
$('when').onchange = e => { when = e.target.value; when ? localStorage.setItem(WHEN, when) : localStorage.removeItem(WHEN); picked.clear(); render(); };
$('sort').onchange = e => { sort = e.target.value; localStorage.setItem(SORT, sort); render(); };
$('move').onchange = e => {
  const v = e.target.value;
  if (!v || !picked.size) return;
  const moving = take([...picked]);
  const gi = v === 'new' ? newGroup() : +v;
  groups[gi].links.push(...moving);
  picked.clear();
  save(`Moved ${plural(moving.length, 'link')} to ${label(groups[gi])}.`);
  if (v === 'new') rename(gi);
};

// drag and drop: a link onto a row (lands above or below it) or onto a folder on the left (lands at its end);
// a folder onto another folder (lands above or below it)
function clearMarks(){ document.querySelectorAll('.before,.after,.into').forEach(n => n.classList.remove('before', 'after', 'into')); }
function half(e, el){ const r = el.getBoundingClientRect(); return e.clientY < r.top + r.height / 2 ? 'before' : 'after'; }
function target(e){
  if (!drag) return null;
  const f = e.target.closest('.fold[data-g]');
  if (drag.kind === 'group') return f && groups[+f.dataset.g].name ? {el: f, where: half(e, f)} : null;
  if (f) return {el: f, where: 'into'};
  const li = e.target.closest('#list li[data-i]');
  return li ? {el: li, where: half(e, li)} : null;
}
const app = $('app');
app.addEventListener('dragstart', e => {
  const f = e.target.closest?.('.fold[draggable]'), li = e.target.closest?.('#list li[data-i]');
  if (f) drag = {kind: 'group', g: +f.dataset.g};
  else if (li) {
    // dragging a ticked link carries every ticked link with it; an unticked one goes alone
    const k = key(li.dataset.g, li.dataset.i);
    drag = {kind: 'link', keys: picked.has(k) ? [...picked] : [k]};
  }
  else return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  if (drag.kind === 'link' && drag.keys.length > 1) {
    const tag = Object.assign(document.createElement('div'), {className: 'dragtag', textContent: plural(drag.keys.length, 'link')});
    document.body.append(tag);
    e.dataTransfer.setDragImage(tag, 10, 10);
    setTimeout(() => tag.remove());
  }
  const els = f ? [f] : drag.keys.map(k => document.querySelector(`input[data-k="${k}"]`)?.closest('li')).filter(Boolean);
  setTimeout(() => { if (!drag) return; els.forEach(el => el.classList.add('dragging')); if (li) document.body.classList.add('linkdrag'); });
});
app.addEventListener('dragover', e => {
  const t = target(e);
  if (!t) return;
  e.preventDefault();
  clearMarks();
  t.el.classList.add(t.where);
});
app.addEventListener('dragleave', e => { if (!app.contains(e.relatedTarget)) clearMarks(); });
app.addEventListener('dragend', () => { if (drag) { drag = null; render(); } document.body.classList.remove('linkdrag'); });
app.addEventListener('drop', e => {
  const t = target(e), d = drag;
  clearMarks();
  drag = null;
  document.body.classList.remove('linkdrag');
  if (!t || !d) return render();
  e.preventDefault();
  const gi = +t.el.dataset.g;
  if (d.kind === 'group') {
    const to = gi + (t.where === 'after' ? 1 : 0);
    if (to === d.g || to === d.g + 1) return render();
    const [g] = groups.splice(d.g, 1);
    groups.splice(to > d.g ? to - 1 : to, 0, g);
    picked.clear();
    return save('Folders reordered.');
  }
  const to = t.where === 'into' ? groups[gi].links.length : +t.el.dataset.i + (t.where === 'after' ? 1 : 0);
  // where they land = how many of the links staying put sit above the drop line
  const moving = new Set(d.keys);
  let at = 0;
  for (let i = 0; i < to; i++) if (!moving.has(key(gi, i))) at++;
  const from = new Set(d.keys.map(k => +k.split(':')[0]));
  const before = JSON.stringify(groups);
  const ls = take(d.keys);
  groups[gi].links.splice(at, 0, ...ls);
  if (JSON.stringify(groups) === before) return render();
  picked.clear();
  const where = from.size === 1 && from.has(gi) ? '' : ` to ${label(groups[gi])}`;
  save(['Moved', ls.length > 1 ? plural(ls.length, 'link') : ''].filter(Boolean).join(' ') + where + '.');
});

$('theme').onclick = () => { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem(TK, d ? 'dark' : 'light'); };
addEventListener('storage', e => { if (e.key === TK) document.documentElement.classList.toggle('dark', e.newValue === 'dark'); });

// a question in the message slot, answered with buttons
function ask(text, choices){
  $('msg').className = '';
  $('msg').innerHTML = esc(text) + choices.map((c, i) => `<button data-c="${i}">${esc(c[0])}</button>`).join('');
  $('msg').querySelectorAll('button').forEach(b => { b.onclick = () => { $('msg').textContent = ''; choices[+b.dataset.c][1](); }; });
}
const pending = () => { const t = localStorage.getItem(PENDING); return t ? JSON.parse(t) : null; };
const setGroups = g => { groups = g && g.length ? g : [{name: '', links: []}]; picked.clear(); };
// adds the links of `from` to `groups`, folder by folder, skipping URLs already there; returns how many went in
function merge(from){
  const have = new Set(groups.flatMap(g => g.links.map(l => l.url)));
  let n = 0;
  for (const g of from) {
    const ls = g.links.filter(l => !have.has(l.url));
    if (!ls.length) continue;
    let gi = groups.findIndex(x => x.name === g.name);
    if (gi < 0) { if (g.name) { groups.push({name: g.name, links: []}); gi = groups.length - 1; } else gi = loose(); }
    groups[gi].links.push(...ls);
    ls.forEach(l => have.add(l.url));
    n += ls.length;
  }
  return n;
}

// the sign-in block under the folders
function account(){
  const note = '<p>Sign in with Google and your list is kept in one file in your own Google Drive. Nothing is stored anywhere else.</p>';
  const a = $('account');
  if (!CONNECTED) a.innerHTML = note + '<button id="signin" disabled>Google not connected yet</button><p>The owner of this page has not connected it to Google yet, so for now your links stay in this browser.</p>';
  else if (mode() === 'drive' && token) a.innerHTML = `<p><span class="ok">Signed in.</span> Your list is <b>${esc(FILE_NAME)}</b> in your Google Drive.</p><button id="signout">Sign out</button>`;
  else if (mode() === 'drive') a.innerHTML = '<p>Google signs you out after about an hour. Sign in again to carry on; nothing is lost.</p><button id="signin">Sign in with Google</button><button id="signout">Sign out</button>';
  else a.innerHTML = note + '<button id="signin">Sign in with Google</button>';
  if ($('signin')) $('signin').onclick = signIn;
  if ($('signout')) $('signout').onclick = signOut;
}

// with a token in hand: find or create the file, read it, bring in anything kept in this browser, render
async function connect(){
  const d = await store.load();
  const kept = pending();
  loaded = true;
  if (kept && !kept.partial) setGroups(kept.groups);                    // the full list, saved here when the write failed
  else {
    setGroups(d);
    if (kept) {                                                           // links added while signed out, with no list to add them to
      const n = merge(kept.groups);
      if (n) say(`${plural(n, 'link')} added while signed out ${n === 1 ? 'is' : 'are'} now in your Drive file.`);
    }
  }
  render(); account();
  if (kept) { localStorage.setItem(PENDING, JSON.stringify({groups})); await sync(); }
}

async function signIn(){
  if (!CONNECTED) return say('The owner of this page has not connected it to Google yet, so your links stay in this browser.', true);
  const btn = $('signin');
  if (btn) btn.disabled = true;
  try { await getToken(false); }
  catch (e) { account(); return say(/popup/.test(e.message) ? 'The Google sign-in window did not open or was closed. Try again.' : "Couldn't sign in with Google. " + e.message, true); }
  if (mode() === 'drive') {                                                 // the token ran out; carry on where it left off
    try { await connect(); if (!pending()) say('Signed in again.'); }
    catch (e) { account(); say("Couldn't read your Drive file; " + e.message + '.', true); }
    return;
  }
  // first sign-in from try-it mode: the browser list may be worth keeping
  const kept = pending();
  const t = localStorage.getItem(STORE);
  const tryIt = kept ? kept.groups : t ? JSON.parse(t).groups : null;
  const worth = tryIt && !justSamples(tryIt) && tryIt.some(g => g.links.length) ? tryIt : null;
  localStorage.removeItem(PENDING);
  localStorage.setItem(SIGNED, '1');
  try { await connect(); }
  catch (e) {
    localStorage.removeItem(SIGNED); localStorage.removeItem(FILE); token = null;
    if (kept) localStorage.setItem(PENDING, JSON.stringify(kept));
    account();
    return say("Couldn't reach your Google Drive (" + e.message + '). Your links stay in this browser for now.', true);
  }
  if (!worth) { localStorage.removeItem(STORE); return say('Signed in. Your links now live in your Google Drive.'); }
  const n = worth.reduce((k, g) => k + g.links.length, 0), inDrive = groups.reduce((k, g) => k + g.links.length, 0);
  ask(`${plural(n, 'link')} ${n === 1 ? 'is' : 'are'} in this browser only.` + (inDrive ? ` Your Drive file already has ${plural(inDrive, 'link')}.` : ''), [
    ['Keep these links', () => { localStorage.removeItem(STORE); const k = merge(worth); save(k ? `Added ${plural(k, 'link')} to your Drive file.` : 'Those links were already in your Drive file.'); }],
    [inDrive ? 'Drop them' : 'Start empty', () => { localStorage.removeItem(STORE); say(inDrive ? 'Dropped. Your Drive list is what you see.' : 'Started empty. Your links now live in your Google Drive.'); }],
  ]);
}

// forgets the sign-in and goes back to try-it mode; the Drive file stays; nothing unsaved is dropped
async function signOut(){
  if (pending()) {
    try { await push(); }
    catch (e) { return say('Some changes are not in your Drive file yet; the file updates once ' + e.message + '. Not signed out, so nothing is lost.', true); }
  }
  token = null; loaded = false;
  localStorage.removeItem(SIGNED); localStorage.removeItem(FILE); localStorage.removeItem(PENDING);
  setGroups(await store.load());
  render(); account();
  say('Signed out. Your links stay in your Google Drive; this page is back to try-it mode.');
}

// load the list once; notes (older descriptions keyed by URL) stays empty in this app
async function boot(){
  const kept = pending();
  if (mode() === 'drive') {
    loaded = !!(kept && !kept.partial);
    setGroups(kept ? kept.groups : []);
    render(); account();
    try { await getToken(true); await connect(); }
    catch {
      account();
      say(kept ? 'Changes kept in this browser are not in your Drive file yet. Sign in to save them.' : 'Sign in with Google to see your links.', true);
    }
    return;
  }
  const d = await store.load();
  // the list used to be one flat list of links; now it is a list of groups
  setGroups(kept ? kept.groups : !d ? [] : d.length && !('links' in d[0]) ? [{name: '', links: d}] : d);
  render(); account();
  if (kept) { say('Changes kept in this browser are not saved yet; trying again.', true); sync(); }
}
boot().catch(() => say("Couldn't load the links.", true));
// for the fake-Drive test in test/drive.test.html
window.mylinks = {get groups(){ return groups; }, get token(){ return token; }, signIn, signOut, add, save, justSamples, SAMPLES};
</script>
